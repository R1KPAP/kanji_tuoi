name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_name: kanji-tuoi-linux-x86_64.tar.gz
            bin_name: kanji_tuoi
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: kanji-tuoi-windows-x86_64.zip
            bin_name: kanji_tuoi.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: kanji-tuoi-macos-aarch64.tar.gz
            bin_name: kanji_tuoi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Run data preparation and build
        run: cargo run --bin data_prep --features data_prep --release

      - name: Build main application
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package for Linux/macOS
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.archive_name }} -C target/${{ matrix.target }}/release ${{ matrix.bin_name }}

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }} -DestinationPath ${{ matrix.archive_name }}

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*