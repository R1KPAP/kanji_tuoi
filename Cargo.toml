[package]
name = "kanji_tui"
version = "0.1.0"
edition = "2024"
description = "TUI app to display KANJI"
license = "MIT"
authors = ["Riccardo Paparozzi"]
default-run = "kanji_tui"

[dependencies]
bincode = "1.3.3"
ratatui = "0.30.2"
crossterm = "0.29.0"
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = {version = "1.0.151", optional = true }
rusqlite = { version = "0.40.2", optional = true, features = ["bundled"] }
lyon_geom = { version = "1.0", optional = true }
usvg = { version = "0.48.1", optional = true }
quick-xml = { version = "0.42.0", optional = true }
encoding_rs = { version = "0.8.35", optional = true }
wana_kana = { version = "5.0.0", optional = true }
anyhow = { version = "1.0.104", optional = true }
rayon = { version = "1.12.0", optional = true }
textwrap = { version = "0.16.2", features = ["unicode-width"] }

[[bin]]
name = "data_prep"
path = "src/bin/data_preparation.rs"
required-features = ["data_prep"]

[features]
default = ["json-backend"]
data_prep = [
    "dep:wana_kana",
    "dep:lyon_geom",
    "dep:usvg",
    "dep:quick-xml",
    "dep:encoding_rs",
    "dep:anyhow",
    "dep:rayon",
]
json-backend = ["dep:serde", "dep:serde_json"]
sqlite-backend = ["dep:rusqlite"]